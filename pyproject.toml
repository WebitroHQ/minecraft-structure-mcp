[project]
name = "minecraft-structure-mcp"
version = "0.1.0"
description = "An MCP server for designing Minecraft structures (structure-block .nbt files) with an AI assistant: build, read back, render, save."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SpicesFire" }]
keywords = ["minecraft", "mcp", "model-context-protocol", "claude", "structure", "nbt"]
dependencies = ["mcp>=2.0", "nbtlib>=2.0", "numpy>=1.24", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/SpicesFire/minecraft-structure-mcp"

[project.scripts]
minecraft-structure-mcp = "mcstructure_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcstructure_mcp"]
